<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Cube Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .cube {
      position: relative;
      width: 100px;
      height: 100px;
      transform-style: preserve-3d;
      animation: spin 10s infinite linear;
    }

    .cube div {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: rgba(64, 158, 255, 0.85);
      border: 1px solid #1b63aa;
      box-shadow: 0 0 20px rgba(64, 158, 255, 0.4);
    }

    .cube div:nth-child(1) { transform: rotateY(0deg) translateZ(50px); }   /* front */
    .cube div:nth-child(2) { transform: rotateY(180deg) translateZ(50px); } /* back */
    .cube div:nth-child(3) { transform: rotateY(90deg) translateZ(50px); }  /* right */
    .cube div:nth-child(4) { transform: rotateY(-90deg) translateZ(50px); } /* left */
    .cube div:nth-child(5) { transform: rotateX(90deg) translateZ(50px); }  /* top */
    .cube div:nth-child(6) { transform: rotateX(-90deg) translateZ(50px); } /* bottom */

    @keyframes spin {
      0% {
        transform: rotateX(-20deg) rotateY(0deg);
      }
      100% {
        transform: rotateX(-20deg) rotateY(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="cube">
    <div></div> <!-- front -->
    <div></div> <!-- back -->
    <div></div> <!-- right -->
    <div></div> <!-- left -->
    <div></div> <!-- top -->
    <div></div> <!-- bottom -->
  </div>
</body>
</html>
